<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>امیر سایت | در حال بروزرسانی</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --blue:#149cff;
    --blue2:#006eff;
    --cyan:#00d9ff;
    --white:#ffffff;
    --text:#10365d;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:"Vazirmatn",sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 20%,rgba(0,183,255,.28),transparent 25%),
        radial-gradient(circle at 85% 15%,rgba(74,126,255,.25),transparent 25%),
        radial-gradient(circle at 80% 85%,rgba(0,220,255,.22),transparent 30%),
        linear-gradient(135deg,#eef9ff,#dff3ff,#f8fdff);
    position:relative;
}

/* =========================
   ANIMATED GRID
========================= */

.grid{
    position:fixed;
    inset:-100px;
    opacity:.28;
    background-image:
        linear-gradient(rgba(20,156,255,.12) 1px,transparent 1px),
        linear-gradient(90deg,rgba(20,156,255,.12) 1px,transparent 1px);
    background-size:55px 55px;
    transform:perspective(500px) rotateX(60deg) scale(1.7);
    transform-origin:center;
    animation:gridMove 10s linear infinite;
    pointer-events:none;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:0 550px;
    }
}

/* =========================
   GLOWING ORBS
========================= */

.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
    mix-blend-mode:multiply;
}

.orb.one{
    width:330px;
    height:330px;
    top:-100px;
    right:-80px;
    background:radial-gradient(circle at 35% 35%,#72e7ff,#149cff 45%,transparent 70%);
    animation:orbOne 8s ease-in-out infinite;
}

.orb.two{
    width:280px;
    height:280px;
    bottom:-80px;
    left:-70px;
    background:radial-gradient(circle at 45% 40%,#6dc7ff,#006eff 45%,transparent 70%);
    animation:orbTwo 10s ease-in-out infinite;
}

.orb.three{
    width:190px;
    height:190px;
    top:38%;
    left:5%;
    background:radial-gradient(circle,#00e5ff,transparent 68%);
    opacity:.65;
    animation:orbThree 7s ease-in-out infinite;
}

.orb.four{
    width:210px;
    height:210px;
    bottom:15%;
    right:5%;
    background:radial-gradient(circle,#458cff,transparent 68%);
    opacity:.5;
    animation:orbFour 9s ease-in-out infinite;
}

@keyframes orbOne{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-70px,80px) scale(1.18)}
}

@keyframes orbTwo{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(100px,-70px) scale(1.2)}
}

@keyframes orbThree{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-80px)}
}

@keyframes orbFour{
    0%,100%{transform:translate(0)}
    50%{transform:translate(-70px,50px)}
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff;
    box-shadow:
        0 0 8px #149cff,
        0 0 18px #00d9ff;
    animation:particleFloat linear infinite;
    opacity:.7;
}

@keyframes particleFloat{
    0%{
        transform:translateY(110vh) scale(.3);
        opacity:0;
    }
    15%{opacity:.8}
    85%{opacity:.8}
    100%{
        transform:translateY(-15vh) scale(1);
        opacity:0;
    }
}

/* =========================
   MAIN
========================= */

.wrapper{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    position:relative;
    z-index:5;
}

/* =========================
   GLASS CARD
========================= */

.card{
    width:min(920px,95vw);
    min-height:590px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.85);
    border-radius:38px;
    background:rgba(255,255,255,.48);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    box-shadow:
        0 35px 90px rgba(0,101,190,.18),
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(255,255,255,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 40px;
    animation:cardEntrance 1.2s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardEntrance{
    0%{
        opacity:0;
        transform:translateY(80px) scale(.88) rotateX(12deg);
        filter:blur(15px);
    }
    70%{
        transform:translateY(-8px) scale(1.02);
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1) rotateX(0);
        filter:blur(0);
    }
}

/* animated glass shine */

.card::before{
    content:"";
    position:absolute;
    width:230px;
    height:900px;
    top:-180px;
    right:-250px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.65),
        transparent
    );
    transform:rotate(25deg);
    animation:shine 5s ease-in-out infinite;
}

@keyframes shine{
    0%{right:-300px}
    45%,100%{right:1100px}
}

/* border glow */

.card::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:38px;
    padding:1px;
    background:linear-gradient(
        120deg,
        rgba(255,255,255,.9),
        rgba(0,174,255,.4),
        rgba(255,255,255,.9)
    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    animation:borderPulse 4s ease-in-out infinite;
    pointer-events:none;
}

@keyframes borderPulse{
    0%,100%{opacity:.5}
    50%{opacity:1}
}

/* =========================
   CONTENT
========================= */

.content{
    width:100%;
    max-width:720px;
    text-align:center;
    position:relative;
    z-index:2;
}

.logo{
    display:inline-flex;
    align-items:center;
    gap:12px;
    padding:10px 19px;
    border-radius:100px;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 10px 35px rgba(0,116,220,.12);
    font-size:16px;
    font-weight:800;
    color:#0878d1;
    margin-bottom:28px;
    animation:logoFloat 4s ease-in-out infinite;
}

.logo-icon{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:11px;
    color:#fff;
    background:linear-gradient(135deg,#00cfff,#087cff);
    box-shadow:
        0 6px 20px rgba(0,135,255,.35),
        inset 0 1px 0 rgba(255,255,255,.5);
    animation:logoSpin 5s linear infinite;
}

@keyframes logoFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-7px)}
}

@keyframes logoSpin{
    0%{transform:rotate(0)}
    100%{transform:rotate(360deg)}
}

/* =========================
   BIG ICON
========================= */

.icon-wrap{
    width:135px;
    height:135px;
    margin:0 auto 28px;
    position:relative;
    display:grid;
    place-items:center;
}

.icon-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid rgba(20,156,255,.18);
    animation:ringRotate 5s linear infinite;
}

.icon-ring:nth-child(2){
    inset:11px;
    border-color:rgba(0,210,255,.28);
    animation-direction:reverse;
    animation-duration:3.5s;
}

.icon-ring:nth-child(3){
    inset:23px;
    border-style:dashed;
    border-color:rgba(0,111,255,.25);
    animation-duration:7s;
}

.icon-core{
    width:78px;
    height:78px;
    border-radius:26px;
    display:grid;
    place-items:center;
    font-size:38px;
    background:linear-gradient(145deg,#0daeff,#006eff);
    color:#fff;
    box-shadow:
        0 15px 40px rgba(0,113,255,.35),
        inset 0 2px 5px rgba(255,255,255,.45);
    animation:corePulse 2.2s ease-in-out infinite;
}

@keyframes ringRotate{
    to{transform:rotate(360deg)}
}

@keyframes corePulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 15px 40px rgba(0,113,255,.35);
    }
    50%{
        transform:scale(1.08);
        box-shadow:
            0 20px 55px rgba(0,113,255,.48),
            0 0 35px rgba(0,209,255,.25);
    }
}

/* =========================
   TEXT
========================= */

.badge{
    display:inline-block;
    font-size:13px;
    font-weight:700;
    color:#0878d1;
    background:rgba(18,153,255,.09);
    border:1px solid rgba(18,153,255,.14);
    border-radius:100px;
    padding:7px 14px;
    margin-bottom:15px;
    animation:badgePulse 2.5s ease-in-out infinite;
}

@keyframes badgePulse{
    0%,100%{box-shadow:0 0 0 rgba(0,150,255,0)}
    50%{box-shadow:0 0 25px rgba(0,150,255,.16)}
}

h1{
    font-size:clamp(35px,6vw,64px);
    line-height:1.2;
    font-weight:900;
    letter-spacing:-2px;
    margin-bottom:17px;
    background:linear-gradient(
        100deg,
        #064b8e,
        #008cff,
        #00cfff,
        #064b8e
    );
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:titleGradient 5s linear infinite;
}

@keyframes titleGradient{
    to{background-position:300% center}
}

.description{
    font-size:17px;
    line-height:2;
    color:#4c6d8e;
    max-width:600px;
    margin:0 auto 30px;
    animation:fadeUp 1s .5s both;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   LOADER
========================= */

.loader-area{
    margin:0 auto 27px;
    width:min(500px,90%);
}

.loader-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
    font-size:12px;
    color:#6585a2;
    font-weight:700;
}

.loader{
    height:10px;
    padding:2px;
    border-radius:50px;
    background:rgba(0,100,180,.08);
    overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(0,80,160,.08);
}

.loader-bar{
    width:0;
    height:100%;
    border-radius:50px;
    background:linear-gradient(90deg,#006eff,#00cfff,#72f1ff,#006eff);
    background-size:300% 100%;
    box-shadow:0 0 15px rgba(0,163,255,.45);
    animation:
        loading 8s cubic-bezier(.4,0,.2,1) forwards,
        loaderGradient 1.4s linear infinite;
}

@keyframes loading{
    0%{width:0}
    20%{width:24%}
    50%{width:58%}
    72%{width:76%}
    90%{width:91%}
    100%{width:100%}
}

@keyframes loaderGradient{
    to{background-position:300% 0}
}

/* =========================
   STATUS
========================= */

.status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:#47708f;
    font-size:13px;
    font-weight:600;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00b8ff;
    box-shadow:0 0 0 0 rgba(0,184,255,.5);
    animation:statusPulse 1.7s infinite;
}

@keyframes statusPulse{
    0%{
        box-shadow:0 0 0 0 rgba(0,184,255,.5);
    }
    70%{
        box-shadow:0 0 0 12px rgba(0,184,255,0);
    }
    100%{
        box-shadow:0 0 0 0 rgba(0,184,255,0);
    }
}

/* =========================
   FLOATING SYMBOLS
========================= */

.symbol{
    position:fixed;
    color:rgba(0,123,220,.14);
    font-size:30px;
    font-weight:900;
    pointer-events:none;
    z-index:1;
}

.s1{
    top:12%;
    left:12%;
    animation:symbol1 6s ease-in-out infinite;
}

.s2{
    top:20%;
    right:15%;
    animation:symbol2 8s ease-in-out infinite;
}

.s3{
    bottom:18%;
    left:18%;
    animation:symbol3 7s ease-in-out infinite;
}

.s4{
    bottom:12%;
    right:16%;
    animation:symbol4 6s ease-in-out infinite;
}

@keyframes symbol1{
    0%,100%{transform:translate(0) rotate(0)}
    50%{transform:translate(20px,-30px) rotate(25deg)}
}

@keyframes symbol2{
    0%,100%{transform:translate(0) rotate(0)}
    50%{transform:translate(-25px,35px) rotate(-30deg)}
}

@keyframes symbol3{
    0%,100%{transform:translate(0)}
    50%{transform:translate(30px,-20px)}
}

@keyframes symbol4{
    0%,100%{transform:translate(0) rotate(0)}
    50%{transform:translate(-25px,-35px) rotate(25deg)}
}

/* =========================
   CORNER DECORATION
========================= */

.corner{
    position:absolute;
    width:90px;
    height:90px;
    border:2px solid rgba(0,146,255,.16);
    pointer-events:none;
}

.corner.tl{
    top:20px;
    left:20px;
    border-right:0;
    border-bottom:0;
    border-radius:25px 0 0 0;
}

.corner.br{
    bottom:20px;
    right:20px;
    border-left:0;
    border-top:0;
    border-radius:0 0 25px 0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    body{
        overflow:auto;
    }

    .wrapper{
        min-height:100vh;
        padding:15px;
    }

    .card{
        min-height:620px;
        border-radius:28px;
        padding:45px 20px;
    }

    .card::after{
        border-radius:28px;
    }

    .icon-wrap{
        width:115px;
        height:115px;
    }

    .icon-core{
        width:68px;
        height:68px;
        font-size:32px;
        border-radius:22px;
    }

    h1{
        font-size:38px;
        letter-spacing:-1px;
    }

    .description{
        font-size:15px;
        line-height:1.9;
    }

    .logo{
        margin-bottom:22px;
    }

    .orb.one{
        width:230px;
        height:230px;
    }

    .orb.two{
        width:210px;
        height:210px;
    }

    .symbol{
        display:none;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>
<div class="orb four"></div>

<div class="symbol s1">✦</div>
<div class="symbol s2">✧</div>
<div class="symbol s3">+</div>
<div class="symbol s4">×</div>

<div class="particles" id="particles"></div>

<main class="wrapper">

    <section class="card">

        <div class="corner tl"></div>
        <div class="corner br"></div>

        <div class="content">

            <div class="logo">
                <div class="logo-icon">A</div>
                <span>امیر سایت</span>
            </div>

            <div class="icon-wrap">
                <div class="icon-ring"></div>
                <div class="icon-ring"></div>
                <div class="icon-ring"></div>

                <div class="icon-core">
                    ⚙
                </div>
            </div>

            <div class="badge">
                ● بروزرسانی در حال انجام
            </div>

            <h1>
                سایت در حال بروزرسانی است
            </h1>

            <p class="description">
                در حال آماده‌سازی نسخه‌ای بهتر، سریع‌تر و جذاب‌تر هستیم.
                <br>
                کمی صبر کنید، به‌زودی برمی‌گردیم …
            </p>

            <div class="loader-area">

                <div class="loader-top">
                    <span>در حال آماده‌سازی</span>
                    <span id="percent">0%</span>
                </div>

                <div class="loader">
                    <div class="loader-bar"></div>
                </div>

            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">تیم امیر سایت در حال کار روی نسخه جدید است</span>
            </div>

        </div>

    </section>

</main>

<script>

/* =========================
   PARTICLES
========================= */

const particles = document.getElementById("particles");

for(let i=0;i<55;i++){

    const p=document.createElement("span");

    p.className="particle";

    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(5+Math.random()*9)+"s";
    p.style.animationDelay=(-Math.random()*12)+"s";

    const size=2+Math.random()*4;

    p.style.width=size+"px";
    p.style.height=size+"px";

    particles.appendChild(p);
}


/* =========================
   LOADER PERCENT
========================= */

const percent=document.getElementById("percent");
const statusText=document.getElementById("statusText");

let start=Date.now();
const duration=8000;

function updateProgress(){

    const elapsed=Date.now()-start;
    let progress=Math.min(elapsed/duration,1);

    let value=Math.floor(progress*100);

    percent.textContent=value+"%";

    if(value<25){
        statusText.textContent="در حال آماده‌سازی نسخه جدید...";
    }
    else if(value<55){
        statusText.textContent="در حال بهینه‌سازی بخش‌های سایت...";
    }
    else if(value<80){
        statusText.textContent="در حال اعمال تغییرات جدید...";
    }
    else if(value<100){
        statusText.textContent="تقریباً آماده‌ایم...";
    }
    else{
        statusText.textContent="نسخه جدید آماده می‌شود...";
    }

    if(progress<1){
        requestAnimationFrame(updateProgress);
    }
}

requestAnimationFrame(updateProgress);


/* =========================
   MOUSE PARALLAX
========================= */

const card=document.querySelector(".card");

document.addEventListener("mousemove",(e)=>{

    if(window.innerWidth<800) return;

    const x=(e.clientX/window.innerWidth-.5);
    const y=(e.clientY/window.innerHeight-.5);

    card.style.transform=
        `perspective(1200px)
         rotateY(${x*3}deg)
         rotateX(${y*-3}deg)
         translateY(0)`;
});

document.addEventListener("mouseleave",()=>{
    card.style.transform="";
});


/* =========================
   RANDOM FLOATING PARTICLES
========================= */

setInterval(()=>{

    const p=document.createElement("span");

    p.className="particle";

    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(6+Math.random()*8)+"s";

    particles.appendChild(p);

    setTimeout(()=>{
        p.remove();
    },14000);

},700);

</script>

</body>
</html>
